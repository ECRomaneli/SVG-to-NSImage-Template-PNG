<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG to NSImage Template Converter</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="container">
        <h1>SVG to NSImage Template Converter</h1>
        
        <div class="input-section">
            <div class="file-input" id="dropZone">
                <label for="svgFile">Upload SVG File:</label>
                <input type="file" id="svgFile" accept=".svg">
                <div class="file-input-text">or drop SVG file here</div>
            </div>
            <div class="input-inline">
                <div class="name-input">
                    <label for="imageName">Image Name:</label>
                    <input type="text" id="imageName" placeholder="icon">
                </div>
                
                <div class="custom-scales">
                    <label for="customScales">Custom Scales:</label>
                    <input type="text" id="customScales" placeholder="e.g., 1, 2, 3" />
                </div>
                
                <div class="color-override">
                    <label for="customScales">Override Colors:</label>
                    <div class="color-input">
                        <input type="color" id="colorOverride" value="#000000">
                        <input type="text" id="colorOverrideText" placeholder="#ffffff or rgb(255,255,255)">
                    </div>
                </div>
            </div>            
            <div class="aspect-ratio-toggle">
                <input type="checkbox" id="keepAspectRatio">
                <label for="keepAspectRatio">Preserve Aspect Ratio</label>
            </div>
            
            <button id="convertBtn">Convert SVG to PNGs</button>
        </div>
        
        <div class="preview-section">
            <h2>Generated Images:</h2>
            <div id="imagesContainer"></div>
        </div>
        
        <div class="download-all">
            <button id="downloadAllBtn" disabled>Download All Images</button>
        </div>
    </div>
    
    <script src="assets/vendor/jszip-3.10.1.min.js"></script>
    <script src="assets/vendor/filesaver-2.0.5.min.js"></script>
    <script src="assets/script.js"></script>
</body>
</html>
